<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerador de Tablaturas</title>

    <script>window.global = window;</script>
    <script>
      (function () {
        try {
          var tema = localStorage.getItem('tema') === 'dark' ? 'dark' : 'light';
          var contraste = localStorage.getItem('altoContraste') === 'true' ? 'alto' : 'normal';
          document.documentElement.setAttribute('data-theme', tema);
          document.documentElement.setAttribute('data-contrast', contraste);
        } catch (e) {}
      })();
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
